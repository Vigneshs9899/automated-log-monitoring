
groups:
  - name: application-alerts
    rules:

      # Alert when application is unavailable
      - alert: ApplicationDown
        expr: up{job="support-application"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Application is DOWN"
          description: "The support application is not responding."

      # Alert when HTTP 5xx error rate is high
      - alert: HighHTTP5xxErrorRate
        expr: |
          sum(rate(app_http_requests_total{status=~"5..", endpoint!="/metrics"}[5m])) > 0.05
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "Application is generating HTTP 5xx errors."
